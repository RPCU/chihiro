host: "0.0.0.0"
port: 8080

oidc:
  issuer_url: "https://rpcu-gabeck.eu1.zitadel.cloud"
  client_id: "377050089077613929"
  redirect_url: "http://chihiro.example.com/auth/callback"

redis:
  addr: "redis:6379"
  session_ttl: 3600

cluster:
  domain: "clusters.example.com"
  port: 443

  # Kubernetes versions available for new clusters
  available_versions:
    - "v1.36.1"
    - "v1.31.2"

  # Groups that get full admin access (all clusters, all params)
  admin_groups:
    - kube-admin

  # Groups allowed to create clusters
  creator_groups:
    - kube-admin
    - kube-user

  # Hard limits on total cluster resources across the fleet
  limits:
    max_clusters: 10
    max_total_nodes: 50
    max_total_cp: 9

  # Namespace where CAPI clusters are created
  namespace: mgmt

  # --- Injections: built-in fields that map cluster form values to spec paths ---
  injections:
    name:
      path: metadata.name
    version:
      path: spec.topology.version
    serviceDomain:
      path: spec.clusterNetwork.serviceDomain
    controlPlaneReplicas:
      path: spec.topology.controlPlane.replicas
    nodes:
      path: spec.topology.workers.machineDeployments[0].replicas

  # --- Template: the CAPI cluster object rendered on creation ---
  # Use {{ chihiro.<key> }} placeholders for dynamic values.
  # Built-in tokens: {{ chihiro.version }}, {{ chihiro.name }}, {{ chihiro.podCIDR }}, {{ chihiro.serviceCIDR }}
  template: |
    apiVersion: cluster.x-k8s.io/v1beta2
    kind: Cluster
    metadata:
      name: ignore
      namespace: mgmt
      labels:
        managed-by: chihiro
    spec:
      clusterNetwork:
        pods:
          cidrBlocks:
            - {{ chihiro.podCIDR }}
        serviceDomain: {{ chihiro.serviceDomain }}
        services:
          cidrBlocks:
            - {{ chihiro.serviceCIDR }}
      topology:
        classRef:
          name: openstack-kamaji
        controlPlane:
          replicas: {{ chihiro.controlPlaneReplicas }}
        version: "0.0.0"
        workers:
          machineDeployments:
            - class: default-worker
              name: worker
              replicas: {{ chihiro.nodes }}
              variables:
                overrides:
                  - name: workerFlavor
                    value: {{ chihiro.workerFlavor }}
        variables:
          - name: identityRef
            value:
              cloudName: production
              name: mgmt-cloud-config
          - name: externalNetworkId
            value: "1cfd69da-057c-4748-a0d4-de5b0ca77db2"
          - name: imageName
            value: {{ chihiro.imageName }}
          - name: managedSubnetCIDR
            value: {{ chihiro.managedSubnetCIDR }}
          - name: dataStoreName
            value: default
          - name: workerFlavor
            value: {{ chihiro.workerFlavor }}
          - name: oidc
            value:
              enabled: true
              clientID: "377050089077613929"
              issuerURL: "https://rpcu-gabeck.eu1.zitadel.cloud"
              usernameClaim: sub
              usernamePrefix: ""
              groupsClaim: groups
              groupsPrefix: ""

  # --- Parameters: dynamic form fields for the cluster creation UI ---
  # Supported types: string, number, select, boolean
  # Each parameter becomes a {{ chihiro.<key> }} placeholder in the template.
  parameters:
    # Pod networking CIDR
    podCIDR:
      label: "Pod CIDR"
      description: "CIDR block for pod networking"
      type: string
      default: "10.208.0.0/16"

    # Service networking CIDR
    serviceCIDR:
      label: "Service CIDR"
      description: "CIDR block for service networking"
      type: string
      default: "10.108.0.0/16"

    # Service domain
    serviceDomain:
      label: "Service Domain"
      description: "DNS domain for cluster services"
      type: string
      default: "cluster.local"
      editable: true
      path: spec.clusterNetwork.serviceDomain

    # Glance image for worker nodes
    imageName:
      label: "Node Image"
      description: "Glance image name for worker machines"
      type: select
      editable: true
      options:
        - value: "hephaestus-kaas-2-26.05-v1.36.1"
          label: "Hephaestus v1.36.1"
          constrain:
            version: ["v1.36.1"]
        - value: "hephaestus-kaas-2-26.05-v1.31.2"
          label: "Hephaestus v1.31.2"
          constrain:
            version: ["v1.31.2"]
      default: "hephaestus-kaas-2-26.05-{{ chihiro.version }}"

    # OpenStack flavor for worker nodes
    workerFlavor:
      label: "Worker Flavor"
      description: "OpenStack flavor for worker machines"
      type: select
      editable: true
      options:
        - value: "xmedium"
          label: "xmedium (4 vCPU, 8 GB)"
        - value: "large"
          label: "large (8 vCPU, 16 GB)"
        - value: "xlarge"
          label: "xlarge (16 vCPU, 32 GB)"
      default: "xmedium"

    # Managed subnet CIDR for worker nodes
    managedSubnetCIDR:
      label: "Managed Subnet CIDR"
      description: "CIDR for the managed node subnet in OpenStack"
      type: string
      default: "192.168.1.0/24"

    # Control plane replicas
    controlPlaneReplicas:
      label: "Control Plane Replicas"
      description: "Number of control plane nodes (odd numbers recommended)"
      type: number
      default: "3"
      min: 1
      max: 9
      editable: true
      path: spec.topology.controlPlane.replicas

    # Worker nodes count
    nodes:
      label: "Worker Nodes"
      description: "Number of worker nodes"
      type: number
      default: "1"
      min: 0
      max: 20
