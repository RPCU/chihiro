name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Vet, test and build with the regular Go toolchain: setup-go restores the
  # module and build caches, so unchanged packages aren't recompiled. The Nix
  # build (nix-build.yaml) only runs when its inputs change.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o chihiro .
