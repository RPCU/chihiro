name: Nix Build

# Only when the Nix build's inputs change (e.g. a dependency bump needing a
# new vendorHash). Every other change is vetted, tested and built by ci.yaml.
on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - nix/**
      - .github/workflows/nix-build.yaml
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - nix/**
      - .github/workflows/nix-build.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # The image contains the binaries, so this builds them once and verifies
      # vendorHash. Tests run in ci.yaml.
      - name: Build OCI image
        run: nix-build nix/oci.nix --argstr doCheck false
